<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="color-scheme" content="dark">
  <meta name="description"
    content="Chúc mừng sinh nhật Nguyễn Trà Mi – 30/06. Một trải nghiệm 3D đặc biệt dành riêng cho bạn.">
  <title>Happy Birthday ✦ Trà Mi</title>

  <!-- Font Preloads -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Three.js r160 + addons via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.435.0/dist/umd/lucide.min.js" defer></script>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loader" aria-hidden="true">
    <div class="loader-radiance"></div>
    <div class="loader-center">
      <span class="loader-pre">✦ Happy Birthday ✦</span>
      <span class="loader-name">Trà Mi</span>
      <span class="loader-sub">Preparing your surprise...</span>
    </div>
    <div class="loader-progress">
      <div class="loader-progress-bar" id="loader-bar"></div>
    </div>
  </div>

  <!-- 3D Canvas Container -->
  <canvas id="scene-canvas"></canvas>

  <!-- Scroll Hint (thin UI overlay) -->
  <div id="scroll-hint" class="scroll-hint" hidden>
    <span>Scroll to explore</span>
    <i data-lucide="chevron-down"></i>
  </div>

  <!-- Music Player -->
  <div id="music-player" class="music-player" aria-label="Phát nhạc nền">
    <button id="music-toggle" class="music-btn" aria-label="Bật/tắt nhạc">
      <i id="music-icon-off" data-lucide="volume-x"></i>
      <i id="music-icon-on" data-lucide="volume-2" style="display:none"></i>
    </button>
  </div>
  <audio id="bg-music" loop preload="none">
    <source src="https://cdn.pixabay.com/audio/2022/10/18/audio_5220019853.mp3" type="audio/mpeg">
  </audio>

  <!-- Countdown Timer -->
  <div id="countdown-timer" class="countdown-timer" hidden>
    <div class="countdown-label">✦ Còn bao lâu nữa? ✦</div>
    <div class="countdown-blocks">
      <div class="countdown-block"><span id="cd-days" class="cd-val">--</span><span class="cd-unit">ngày</span></div>
      <div class="countdown-sep">:</div>
      <div class="countdown-block"><span id="cd-hours" class="cd-val">--</span><span class="cd-unit">giờ</span></div>
      <div class="countdown-sep">:</div>
      <div class="countdown-block"><span id="cd-mins" class="cd-val">--</span><span class="cd-unit">phút</span></div>
      <div class="countdown-sep">:</div>
      <div class="countdown-block"><span id="cd-secs" class="cd-val">--</span><span class="cd-unit">giây</span></div>
    </div>
    <div class="countdown-date">🎂 30 tháng 6</div>
  </div>

  <!-- Share Button -->
  <div id="share-btn-container" class="share-container">
    <button id="share-btn" class="share-btn" aria-label="Chia sẻ trang">
      <i data-lucide="share-2"></i>
      <span class="share-label">Chia sẻ</span>
    </button>
    <div id="share-toast" class="share-toast" hidden>Đã copy link! ✨</div>
  </div>

  <!-- Time of Day Control Panel -->
  <div id="time-control-panel" class="time-control-container">
    <!-- Main Toggle Button -->
    <button id="time-toggle-btn" class="time-toggle-btn" aria-label="Bật/Tắt sáng tối">
      <i id="time-toggle-icon" data-lucide="sun"></i>
      <span id="time-toggle-label" class="time-btn-label">Tự động (Sáng)</span>
    </button>
    
    <!-- Quick Preset Buttons -->
    <div class="time-preset-buttons">
      <button id="time-btn-light" class="time-preset-btn" title="Cố định Sáng" aria-label="Chế độ Sáng">
        <i data-lucide="sun"></i>
      </button>
      <button id="time-btn-dark" class="time-preset-btn" title="Cố định Tối" aria-label="Chế độ Tối">
        <i data-lucide="moon"></i>
      </button>
      <button id="time-btn-auto" class="time-preset-btn" title="Đồng bộ Giờ Thực" aria-label="Đồng bộ Tự động">
        <i data-lucide="clock"></i>
      </button>
    </div>
  </div>

  <!-- Entry point -->
  <script type="module" src="src/main.js"></script>
</body>

</html>
